appId: com.eamonsdiary.droneweather
---
# San Francisco oversized US pack: must not crash; show prebuilt/too-large error.
- launchApp:
    appId: "com.eamonsdiary.droneweather"
    stopApp: true
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    text: "Dismiss"
    optional: true
- tapOn:
    text: "Minimize"
    optional: true
- extendedWaitUntil:
    visible: "Safe to Fly|Not Safe to Fly|Select hour for conditions"
    timeout: 60000
# Deep-link to the location search screen (tab/LocationBar taps are flaky under XCTest).
- openLink: myapp://location
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Locations|Search launch sites|Search launch sites..."
    timeout: 20000
- tapOn:
    text: "Search launch sites|Search launch sites..."
- inputText: "San Francisco"
- extendedWaitUntil:
    visible: "San Francisco, United States of America"
    timeout: 20000
- tapOn:
    text: "Dismiss"
    optional: true
- tapOn: "San Francisco, United States of America"
- extendedWaitUntil:
    visible: "Safe to Fly|Not Safe to Fly|Select hour for conditions|Locations"
    timeout: 20000
- tapOn:
    text: "Dismiss"
    optional: true
- tapOn:
    text: "Minimize"
    optional: true
- openLink: myapp://map
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "Dismiss"
    optional: true
- extendedWaitUntil:
    visible: "Airspace reference|Reference only|OpenAIP|UK ·|UK pack"
    timeout: 45000
- assertVisible:
    text: "Airspace reference|Reference only|OpenAIP"
- extendedWaitUntil:
    visible: "Updating…"
    timeout: 5000
    optional: true
- extendedWaitUntil:
    notVisible: "Updating…"
    timeout: 90000
- assertVisible:
    text: "Airspace reference|Reference only|OpenAIP"
- assertVisible: "Reference only"
- assertVisible:
    text: ".*too large.*|.*prebuilt pack.*"
