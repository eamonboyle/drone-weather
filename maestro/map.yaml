appId: com.eamonsdiary.droneweather
---
- launchApp
- tapOn: "Map"
- assertVisible: "Airspace reference"
- assertVisible: "Reference only"
- assertVisible: "OpenAIP"
- assertVisible:
    text: "Recenter|Update data|Loading map|Updating…"
    optional: true
- extendedWaitUntil:
    notVisible: "Updating…"
    timeout: 60000
    optional: true
- assertVisible: "Airspace reference"
