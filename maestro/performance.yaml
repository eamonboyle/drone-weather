appId: com.eamonsdiary.droneweather
---
# Full journey (includes Map). Prefer performance-core.yaml for acceptance.
- launchApp
- tapOn: "Home"
- tapOn: "Map"
- assertVisible: "Map"
- tapOn: "Forecast"
- assertVisible: "Forecast"
- assertVisible: "Cards"
- assertVisible: "Table"
- scroll
- tapOn: "Table"
- tapOn: "Cards"
- tapOn: "Table"
- tapOn: "Cards"
- tapOn: "Table"
- tapOn: "Cards"
- tapOn: "Flyable"
- tapOn: "Blocked"
- tapOn: "All"
- tapOn: "Home"
- tapOn: "Select Location"
- assertVisible: "Locations"
- back
- tapOn: "Settings"
- assertVisible: "Settings"
